name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Ruffle compiles its playerglobal with Java during the build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle VST3 + CLAP
        run: cargo xtask bundle swf2daw --release
      - uses: actions/upload-artifact@v4
        with:
          name: swf2DAW-windows
          path: |
            target/bundled/swf2DAW.vst3
            target/bundled/swf2DAW.clap

      # On a version tag (v0.2.0, ...): zips + checksums as a GitHub release
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/bundled/swf2DAW.vst3, LICENSE, README.md -DestinationPath "dist/swf2DAW-$v-windows-vst3.zip"
          Compress-Archive -Path target/bundled/swf2DAW.clap, LICENSE, README.md -DestinationPath "dist/swf2DAW-$v-windows-clap.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: swf2DAW ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
